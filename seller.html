<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - Global Online Shop</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
        body{background:#f0f2f5}
        .sidebar{position:fixed;left:0;top:0;width:260px;height:100%;background:linear-gradient(135deg,#1e8e3e,#0d5c1a);color:white;padding:20px}
        .sidebar h2{text-align:center;margin-bottom:30px}
        .sidebar a{display:block;color:white;text-decoration:none;padding:12px;margin:8px 0;border-radius:8px;cursor:pointer}
        .sidebar a:hover{background:rgba(255,255,255,0.2)}
        .main{margin-left:260px;padding:20px}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:20px}
        .stat-card{background:white;padding:25px;border-radius:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        .stat-card h2{color:#1e8e3e;font-size:2rem}
        .card{background:white;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        input,select,textarea{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px}
        button{background:#1e8e3e;color:white;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold}
        button:hover{background:#0d5c1a}
        table{width:100%;border-collapse:collapse;overflow-x:auto;display:block}
        th,td{padding:12px;text-align:left;border-bottom:1px solid #eee}
        th{background:#1e8e3e;color:white}
        .delete-btn{background:#dc3545;padding:5px 10px}
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;justify-content:center;align-items:center}
        .modal-content{background:white;padding:30px;border-radius:12px;max-width:450px;width:90%}
        .toast{position:fixed;bottom:20px;right:20px;background:#1e8e3e;color:white;padding:12px 20px;border-radius:8px;display:none;z-index:2000}
        .close{float:right;font-size:24px;cursor:pointer;color:#999}
        @media (max-width:768px){.sidebar{width:100%;height:auto;position:relative}.main{margin-left:0}}
    </style>
</head>
<body>

<div id="loginModal" class="modal" style="display:flex;">
    <div class="modal-content">
        <h2 style="color:#1e8e3e;text-align:center;">🛒 Seller Login / Sign Up</h2>
        <div id="authBox">
            <input type="text" id="sellerName" placeholder="Full Name">
            <input type="text" id="sellerPhone" placeholder="Phone Number">
            <input type="password" id="sellerPass" placeholder="Password">
            <input type="password" id="sellerConfirmPass" placeholder="Confirm Password">
            <button id="authBtn" onclick="handleAuth()" style="width:100%;">Sign Up</button>
            <p style="text-align:center; margin-top:15px;">
                <a href="#" onclick="toggleMode()">Already have account? Login</a>
            </p>
        </div>
    </div>
</div>

<div id="sellerDashboard" style="display:none;">
    <div class="sidebar">
        <h2>🛒 Seller Panel</h2>
        <a onclick="showDashboard()">📊 Dashboard</a>
        <a onclick="showProducts()">📦 My Products</a>
        <a onclick="showOrders()">📋 Orders</a>
        <a onclick="showAddProduct()">➕ Add Product</a>
        <a onclick="logout()">🚪 Logout</a>
    </div>

    <div class="main">
        <div class="header" style="background:white;padding:15px;border-radius:12px;margin-bottom:20px;">
            <h1>Seller Dashboard</h1>
            <p id="sellerInfo" style="color:#1e8e3e;"></p>
        </div>

        <div class="stats" id="statsSection">
            <div class="stat-card"><h2 id="totalOrders">0</h2><p>Total Orders</p></div>
            <div class="stat-card"><h2 id="totalSales">৳0</h2><p>Total Sales</p></div>
            <div class="stat-card"><h2 id="totalEarnings">৳0</h2><p>Your Earnings (After 10%)</p></div>
        </div>

        <div class="card" id="dateSearchCard">
            <h3>📅 Search Orders by Date</h3>
            <input type="date" id="searchDate">
            <button onclick="searchOrdersByDate()">Search</button>
            <div id="dateSearchResult" style="margin-top:15px;"></div>
        </div>

        <div id="productsSection" class="card" style="display:none;">
            <h3>Your Products</h3>
            <div id="productsList"></div>
        </div>

        <div id="ordersSection" class="card" style="display:none;">
            <h3>All Orders</h3>
            <div id="allOrdersList"></div>
        </div>

        <div id="addProductSection" class="card" style="display:none;">
            <h3>Add New Product</h3>
            <input type="text" id="prodName" placeholder="Product Name">
            <select id="prodCategory">
                <option>Electronics</option><option>Mobile Phones</option><option>Laptops</option>
                <option>Fashion</option><option>Men's Clothing</option><option>Women's Clothing</option>
                <option>Shoes</option><option>Home & Living</option><option>Sports</option>
                <option>Books</option><option>Beauty</option><option>Groceries</option>
            </select>
            <input type="number" id="prodPrice" placeholder="Price (৳)">
            <textarea id="prodDesc" rows="3" placeholder="Product Description"></textarea>
            <input type="text" id="prodImage" placeholder="Image URL">
            <button onclick="publishProduct()">Publish Product</button>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    let currentSeller = null;
    let isLoginMode = false;

    // Data functions
    function getData(key) {
        let data = localStorage.getItem(key);
        return data ? JSON.parse(data) : [];
    }

    function setData(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
    }

    function showNotification(msg, isError = false) {
        let toast = document.getElementById('toast');
        toast.style.backgroundColor = isError ? '#dc3545' : '#1e8e3e';
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
    }

    function toggleMode() {
        isLoginMode = !isLoginMode;
        let btn = document.getElementById('authBtn');
        let title = document.querySelector('#loginModal h2');
        
        if(isLoginMode) {
            title.innerText = '🔐 Seller Login';
            btn.innerText = 'Login';
            document.getElementById('sellerName').style.display = 'none';
            document.getElementById('sellerConfirmPass').style.display = 'none';
        } else {
            title.innerText = '📝 Seller Sign Up';
            btn.innerText = 'Sign Up';
            document.getElementById('sellerName').style.display = 'block';
            document.getElementById('sellerConfirmPass').style.display = 'block';
        }
    }

    function handleAuth() {
        let phone = document.getElementById('sellerPhone').value;
        let pass = document.getElementById('sellerPass').value;
        
        if(!phone || !pass) {
            showNotification('Please enter phone and password', true);
            return;
        }
        
        let users = getData('shop_users');
        
        if(isLoginMode) {
            // LOGIN
            let seller = users.find(u => u.emailPhone === phone && u.password === pass && u.type === 'seller');
            if(seller) {
                currentSeller = seller;
                setData('shop_currentSeller', currentSeller);
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('sellerDashboard').style.display = 'block';
                document.getElementById('sellerInfo').innerHTML = `👤 ${currentSeller.name} | 📞 ${currentSeller.emailPhone}`;
                showNotification('✅ Login successful!');
                showDashboard();
            } else {
                showNotification('Invalid phone or password', true);
            }
        } else {
            // SIGN UP
            let name = document.getElementById('sellerName').value;
            let confirmPass = document.getElementById('sellerConfirmPass').value;
            
            if(!name) {
                showNotification('Please enter your name', true);
                return;
            }
            if(pass !== confirmPass) {
                showNotification('Passwords do not match', true);
                return;
            }
            
            let existing = users.find(u => u.emailPhone === phone);
            if(existing) {
                showNotification('Phone number already registered', true);
                return;
            }
            
            // Create new seller account (no verification code needed now)
            let newSeller = {
                id: 'seller_' + Date.now(),
                name: name,
                emailPhone: phone,
                password: pass,
                type: 'seller',
                createdAt: new Date().toISOString()
            };
            
            users.push(newSeller);
            setData('shop_users', users);
            currentSeller = newSeller;
            setData('shop_currentSeller', currentSeller);
            
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('sellerDashboard').style.display = 'block';
            document.getElementById('sellerInfo').innerHTML = `👤 ${currentSeller.name} | 📞 ${currentSeller.emailPhone}`;
            showNotification('✅ Account created successfully!');
            showDashboard();
        }
        
        // Clear form
        document.getElementById('sellerName').value = '';
        document.getElementById('sellerPhone').value = '';
        document.getElementById('sellerPass').value = '';
        document.getElementById('sellerConfirmPass').value = '';
    }

    function showDashboard() {
        document.getElementById('productsSection').style.display = 'none';
        document.getElementById('ordersSection').style.display = 'none';
        document.getElementById('addProductSection').style.display = 'none';
        document.getElementById('statsSection').style.display = 'grid';
        document.getElementById('dateSearchCard').style.display = 'block';
        
        let orders = getData('shop_orders');
        let sellerOrders = orders.filter(o => o.sellerId === currentSeller.id);
        
        let totalOrd = sellerOrders.length;
        let totalSales = sellerOrders.reduce((sum, o) => sum + (o.subtotal || 0), 0);
        let totalEarn = sellerOrders.reduce((sum, o) => sum + (o.vendorEarnings || 0), 0);
        
        document.getElementById('totalOrders').innerHTML = totalOrd;
        document.getElementById('totalSales').innerHTML = '৳' + totalSales.toLocaleString();
        document.getElementById('totalEarnings').innerHTML = '৳' + totalEarn.toLocaleString();
    }

    function showProducts() {
        document.getElementById('statsSection').style.display = 'none';
        document.getElementById('dateSearchCard').style.display = 'none';
        document.getElementById('productsSection').style.display = 'block';
        document.getElementById('ordersSection').style.display = 'none';
        document.getElementById('addProductSection').style.display = 'none';
        
        let products = getData('shop_products');
        let sellerProds = products.filter(p => p.sellerId === currentSeller.id);
        
        if(sellerProds.length === 0) {
            document.getElementById('productsList').innerHTML = '<p>No products yet. Click "Add Product" to add.</p>';
            return;
        }
        
        let html = '<table style="width:100%;"><tr style="background:#1e8e3e;color:white;"><th>Image</th><th>Name</th><th>Price</th><th>Status</th><th>Action</th></tr>';
        sellerProds.forEach(p => {
            html += `<tr>
                <td><img src="${p.image || 'https://via.placeholder.com/50'}" width="50" height="50" style="border-radius:8px;"></td>
                <td>${p.name}</td>
                <td>৳${p.price}</td>
                <td>${p.status || 'Approved'}</td>
                <td><button class="delete-btn" onclick="deleteProduct('${p.id}')">Delete</button></td>
            </tr>`;
        });
        html += '</table>';
        document.getElementById('productsList').innerHTML = html;
    }

    function showOrders() {
        document.getElementById('statsSection').style.display = 'none';
        document.getElementById('dateSearchCard').style.display = 'none';
        document.getElementById('productsSection').style.display = 'none';
        document.getElementById('ordersSection').style.display = 'block';
        document.getElementById('addProductSection').style.display = 'none';
        
        let orders = getData('shop_orders');
        let sellerOrders = orders.filter(o => o.sellerId === currentSeller.id);
        
        if(sellerOrders.length === 0) {
            document.getElementById('allOrdersList').innerHTML = '<p>No orders yet.</p>';
            return;
        }
        
        let html = '<table style="width:100%;"><tr style="background:#1e8e3e;color:white;"><th>Order ID</th><th>Customer</th><th>Products</th><th>Amount</th><th>Commission</th><th>Your Earnings</th><th>Status</th><th>Date</th></tr>';
        sellerOrders.forEach(o => {
            html += `<tr>
                <td>${o.id || o.mainOrderId}</td>
                <td>${o.customerName}<br><small>${o.customerPhone}</small></td>
                <td>${o.products}</td>
                <td>৳${(o.subtotal || 0).toLocaleString()}</td>
                <td>৳${(o.commission || 0).toLocaleString()}</td>
                <td>৳${(o.vendorEarnings || 0).toLocaleString()}</td>
                <td>${o.status || 'Pending'}</td>
                <td>${o.date || 'N/A'}</td>
            </tr>`;
        });
        html += '</table>';
        document.getElementById('allOrdersList').innerHTML = html;
    }

    function showAddProduct() {
        document.getElementById('statsSection').style.display = 'none';
        document.getElementById('dateSearchCard').style.display = 'none';
        document.getElementById('productsSection').style.display = 'none';
        document.getElementById('ordersSection').style.display = 'none';
        document.getElementById('addProductSection').style.display = 'block';
    }

    function publishProduct() {
        let name = document.getElementById('prodName').value;
        let category = document.getElementById('prodCategory').value;
        let price = parseFloat(document.getElementById('prodPrice').value);
        let desc = document.getElementById('prodDesc').value;
        let image = document.getElementById('prodImage').value;
        
        if(!name || !price) {
            showNotification('Product name and price required', true);
            return;
        }
        
        let products = getData('shop_products');
        let newProduct = {
            id: 'prod_' + Date.now(),
            sellerId: currentSeller.id,
            sellerName: currentSeller.name,
            name: name,
            category: category,
            price: price,
            desc: desc,
            image: image || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30',
            status: 'approved',
            createdAt: new Date().toISOString()
        };
        
        products.push(newProduct);
        setData('shop_products', products);
        showNotification('✅ Product published!');
        
        // Clear form
        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodDesc').value = '';
        document.getElementById('prodImage').value = '';
        
        showProducts();
    }

    function deleteProduct(productId) {
        if(confirm('Delete this product?')) {
            let products = getData('shop_products');
            products = products.filter(p => p.id !== productId);
            setData('shop_products', products);
            showNotification('Product deleted');
            showProducts();
        }
    }

    function searchOrdersByDate() {
        let date = document.getElementById('searchDate').value;
        if(!date) {
            showNotification('Select a date', true);
            return;
        }
        
        let orders = getData('shop_orders');
        let sellerOrders = orders.filter(o => o.sellerId === currentSeller.id && o.date && o.date.includes(date));
        
        if(sellerOrders.length === 0) {
            document.getElementById('dateSearchResult').innerHTML = `<p>No orders found on ${date}</p>`;
        } else {
            let total = sellerOrders.reduce((sum, o) => sum + (o.subtotal || 0), 0);
            let html = `<h4>Orders on ${date}</h4>
                        <p><strong>Total Sales: ৳${total.toLocaleString()}</strong></p>
                        <table style="width:100%;"><tr style="background:#1e8e3e;color:white;"><th>Customer</th><th>Products</th><th>Amount</th></tr>`;
            sellerOrders.forEach(o => {
                html += `<tr><td>${o.customerName}</td><td>${o.products}</td><td>৳${(o.subtotal || 0).toLocaleString()}</td></tr>`;
            });
            html += '</table>';
            document.getElementById('dateSearchResult').innerHTML = html;
        }
    }

    function logout() {
        localStorage.removeItem('shop_currentSeller');
        location.reload();
    }

    // Check if already logged in
    let savedSeller = localStorage.getItem('shop_currentSeller');
    if(savedSeller) {
        currentSeller = JSON.parse(savedSeller);
        document.getElementById('loginModal').style.display = 'none';
        document.getElementById('sellerDashboard').style.display = 'block';
        document.getElementById('sellerInfo').innerHTML = `👤 ${currentSeller.name} | 📞 ${currentSeller.emailPhone}`;
        showDashboard();
    }
</script>
</body>
</html>
