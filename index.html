<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Global Online Shop - মাল্টি ভেন্ডর মার্কেটপ্লেস</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        :root {
            --primary: #131921;
            --secondary: #FF9900;
            --secondary-hover: #e68900;
            --bg-light: #EAEDED;
            --text-dark: #0F1111;
            --text-gray: #565959;
            --border-light: #ddd;
        }

        body {
            background-color: var(--bg-light);
        }

        /* ========== হেডার স্টাইল ========== */
        .header {
            background-color: var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 20px;
        }

        .header .container {
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .logo h1 {
            color: white;
            font-size: 26px;
            font-weight: bold;
        }

        .logo span {
            color: var(--secondary);
        }

        .search-area {
            flex: 2;
            display: flex;
            min-width: 280px;
        }

        .category-select {
            padding: 12px 15px;
            border: none;
            border-radius: 8px 0 0 8px;
            background: #f0f2f2;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            font-size: 15px;
            outline: none;
        }

        .search-btn {
            background: var(--secondary);
            border: none;
            padding: 0 25px;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            font-size: 18px;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: var(--secondary-hover);
        }

        .header-actions {
            display: flex;
            gap: 20px;
        }

        .header-actions a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ========== ক্যাটাগরি নেভিগেশন ========== */
        .cat-nav {
            background: #232F3E;
            padding: 8px 0;
            overflow-x: auto;
        }

        .cat-nav .container {
            display: flex;
            gap: 25px;
            padding: 8px 20px;
        }

        .cat-link {
            color: white;
            text-decoration: none;
            font-size: 14px;
            white-space: nowrap;
            transition: color 0.2s;
        }

        .cat-link:hover {
            color: var(--secondary);
        }

        /* ========== প্রোডাক্ট গ্রিড ========== */
        .product-section {
            padding: 30px 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 22px;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .product-img {
            width: 100%;
            height: 190px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .product-title {
            font-size: 15px;
            font-weight: 500;
            margin: 8px 0;
            color: var(--text-dark);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .rating {
            color: #ffa41c;
            font-size: 13px;
            margin: 5px 0;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #B12704;
            margin: 8px 0;
        }

        .old-price {
            text-decoration: line-through;
            font-size: 13px;
            color: var(--text-gray);
            margin-left: 8px;
            font-weight: normal;
        }

        .seller-info {
            font-size: 12px;
            color: #007185;
            margin: 6px 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .add-cart-btn {
            background: var(--secondary);
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .add-cart-btn:hover {
            background: var(--secondary-hover);
        }

        .loader, .no-products {
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: var(--text-gray);
            grid-column: 1 / -1;
        }

        .loader i {
            font-size: 40px;
            margin-bottom: 15px;
            display: block;
        }

        /* ========== ফুটার ========== */
        footer {
            background: #232F3E;
            color: #ddd;
            text-align: center;
            padding: 30px 20px;
            margin-top: 40px;
        }

        footer p {
            margin: 8px 0;
        }

        /* ========== মোবাইল রেসপন্সিভ ========== */
        @media (max-width: 768px) {
            .header .container {
                flex-direction: column;
                gap: 12px;
            }
            .search-area {
                width: 100%;
            }
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .product-card {
                padding: 10px;
            }
            .product-img {
                height: 140px;
            }
            .price {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<!-- ========== হেডার ========== -->
<div class="header">
    <div class="container">
        <div class="logo">
            <h1>Global <span>Online Shop</span></h1>
        </div>
        <div class="search-area">
            <select id="categorySelect" class="category-select">
                <option value="">সব ক্যাটাগরি</option>
            </select>
            <input type="text" id="searchInput" class="search-input" placeholder="পণ্য খুঁজুন...">
            <button id="searchBtn" class="search-btn"><i class="fas fa-search"></i></button>
        </div>
        <div class="header-actions">
            <a href="#"><i class="fas fa-user"></i> লগইন</a>
            <a href="#"><i class="fas fa-heart"></i> উইশলিস্ট</a>
            <a href="#"><i class="fas fa-shopping-cart"></i> কার্ট</a>
        </div>
    </div>
</div>

<!-- ========== ক্যাটাগরি নেভিগেশন ========== -->
<div class="cat-nav">
    <div class="container" id="categoryNav">
        <!-- ক্যাটাগরি লিংক এখানে JS দিয়ে লোড হবে -->
    </div>
</div>

<!-- ========== প্রোডাক্ট লিস্ট সেকশন ========== -->
<div class="product-section">
    <div class="container">
        <div id="productContainer" class="product-grid">
            <div class="loader">
                <i class="fas fa-spinner fa-pulse"></i>
                পণ্য লোড হচ্ছে...
            </div>
        </div>
    </div>
</div>

<!-- ========== ফুটার ========== -->
<footer>
    <div class="container">
        <p>✅ শুধুমাত্র অনুমোদিত সেলারদের অনুমোদিত পণ্য দেখানো হচ্ছে</p>
        <p>© 2026 Global Online Shop - মাল্টি ভেন্ডর মার্কেটপ্লেস</p>
    </div>
</footer>

<script>
    // API বেস URL (আপনার ব্যাকএন্ড অনুযায়ী পরিবর্তন করুন)
    const API_BASE = 'backend/api.php';

    // পেজ লোড হলে
    document.addEventListener('DOMContentLoaded', () => {
        loadCategories();
        loadProducts();
        
        // সার্চ বাটন ইভেন্ট
        document.getElementById('searchBtn').addEventListener('click', () => {
            const category = document.getElementById('categorySelect').value;
            const keyword = document.getElementById('searchInput').value;
            loadProducts(category, keyword);
        });
        
        // এন্টার প্রেস করলেও সার্চ হবে
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') {
                const category = document.getElementById('categorySelect').value;
                const keyword = document.getElementById('searchInput').value;
                loadProducts(category, keyword);
            }
        });
        
        // ক্যাটাগরি সিলেক্ট চেঞ্জ হলে
        document.getElementById('categorySelect').addEventListener('change', () => {
            const category = document.getElementById('categorySelect').value;
            const keyword = document.getElementById('searchInput').value;
            loadProducts(category, keyword);
        });
    });

    // ========== ক্যাটাগরি লোড ফাংশন ==========
    async function loadCategories() {
        try {
            // API থেকে ক্যাটাগরি আনা
            const response = await fetch(`${API_BASE}?action=getCategories`);
            const categories = await response.json();
            
            // ড্রপডাউনে যোগ করা
            const select = document.getElementById('categorySelect');
            select.innerHTML = '<option value="">সব ক্যাটাগরি</option>';
            
            // নেভিগেশন বারেও যোগ করা
            const nav = document.getElementById('categoryNav');
            nav.innerHTML = '';
            
            categories.forEach(cat => {
                // ড্রপডাউনে অপশন
                const option = document.createElement('option');
                option.value = cat.id;
                option.textContent = cat.name;
                select.appendChild(option);
                
                // নেভিগেশন লিংক
                const link = document.createElement('a');
                link.href = '#';
                link.className = 'cat-link';
                link.textContent = cat.name;
                link.onclick = (e) => {
                    e.preventDefault();
                    document.getElementById('categorySelect').value = cat.id;
                    loadProducts(cat.id, document.getElementById('searchInput').value);
                };
                nav.appendChild(link);
            });
        } catch(error) {
            console.error('ক্যাটাগরি লোড ব্যর্থ:', error);
            document.getElementById('categorySelect').innerHTML = '<option value="">ক্যাটাগরি লোড হয়নি</option>';
        }
    }

    // ========== প্রোডাক্ট লোড ফাংশন ==========
    // শুধুমাত্র approved সেলারদের approved প্রোডাক্ট দেখাবে
    async function loadProducts(categoryId = '', keyword = '') {
        const container = document.getElementById('productContainer');
        container.innerHTML = '<div class="loader"><i class="fas fa-spinner fa-pulse"></i> পণ্য লোড হচ্ছে...</div>';
        
        try {
            let url = `${API_BASE}?action=getProducts`;
            if(categoryId) url += `&category_id=${categoryId}`;
            if(keyword) url += `&search=${encodeURIComponent(keyword)}`;
            
            const response = await fetch(url);
            const products = await response.json();
            
            if(products.length === 0) {
                container.innerHTML = '<div class="no-products"><i class="fas fa-box-open"></i><br>🔍 কোনো পণ্য পাওয়া যায়নি।<br><small>সেলাররা পণ্য আপলোড করলে এখানে দেখাবে।</small></div>';
                return;
            }
            
            // প্রোডাক্ট কার্ড তৈরি
            container.innerHTML = '';
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                // ডিসকাউন্ট ক্যালকুলেশন
                let discountHtml = '';
                if(product.old_price && product.old_price > product.price) {
                    const discount = Math.round(((product.old_price - product.price) / product.old_price) * 100);
                    discountHtml = `<span style="background:#ffecd6; color:#c45500; font-size:11px; padding:2px 8px; border-radius:12px; margin-left:8px;">-${discount}%</span>`;
                }
                
                // রেটিং স্টার
                const rating = product.rating || 4;
                const stars = '★'.repeat(Math.floor(rating)) + (rating % 1 >= 0.5 ? '½' : '');
                
                card.innerHTML = `
                    <img src="${product.image || 'https://placehold.co/300x300?text=No+Image'}" class="product-img" alt="${product.name}">
                    <div class="product-title">${escapeHtml(product.name)}</div>
                    <div class="rating">
                        ${stars} ${product.review_count ? `(${product.review_count})` : ''}
                    </div>
                    <div class="price">
                        ৳${Number(product.price).toLocaleString()}
                        ${product.old_price ? `<span class="old-price">৳${Number(product.old_price).toLocaleString()}</span>` : ''}
                        ${discountHtml}
                    </div>
                    <div class="seller-info">
                        <i class="fas fa-store"></i> ${escapeHtml(product.seller_name)}
                    </div>
                    <button class="add-cart-btn" onclick="addToCart(${product.id})">
                        <i class="fas fa-shopping-cart"></i> কার্টে যোগ করুন
                    </button>
                `;
                container.appendChild(card);
            });
        } catch(error) {
            console.error('প্রোডাক্ট লোড ব্যর্থ:', error);
            container.innerHTML = '<div class="no-products"><i class="fas fa-exclamation-triangle"></i><br>সার্ভার সংযোগ সমস্যা, পরে চেষ্টা করুন।</div>';
        }
    }

    // কার্টে যোগ করার ফাংশন (পরে ডেভেলপ করবেন)
    function addToCart(productId) {
        alert('কার্টে যোগ হয়েছে! (পূর্ণাঙ্গ কার্ট সিস্টেম পরবর্তী আপডেটে)');
    }

    // XSS থেকে বাঁচার জন্য escape function
    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }
</script>

</body>
</html>
