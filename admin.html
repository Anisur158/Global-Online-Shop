<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Online Shop Admin Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

.login-box{
width:100%;
max-width:400px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 4px 20px rgba(0,0,0,0.1);
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

.login-box h1{
color:green;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:green;
color:white;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
margin-top:10px;
font-weight:bold;
}

button:hover{
background:#009933;
}

#error{
color:red;
margin-top:15px;
display:none;
}

#adminPanel{
display:none;
padding:20px;
}

header{
background:linear-gradient(135deg,#00c853,green);
color:white;
padding:30px;
text-align:center;
border-radius:12px;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 4px 15px #ddd;
}

.card h2{
color:green;
margin-bottom:10px;
}

.menu-bar{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.menu-bar button{
width:auto;
padding:12px 18px;
}

.filters{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 4px 15px #ddd;
margin-bottom:20px;
}

.filters input{
width:auto;
}

table{
width:100%;
border-collapse:collapse;
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 4px 15px #ddd;
}

th{
background:green;
color:white;
padding:15px;
}

td{
padding:14px;
border-bottom:1px solid #eee;
text-align:center;
}

.logout{
background:red;
width:auto;
padding:10px 18px;
margin-top:20px;
}

footer{
text-align:center;
padding:20px;
background:#111;
color:white;
margin-top:30px;
}

.status{
color:orange;
font-weight:bold;
}

</style>
</head>

<body>

<div class="login-box" id="loginBox">

<h1>Admin Login</h1>

<input type="text" id="username" placeholder="Enter Username">

<input type="password" id="password" placeholder="Enter Password">

<button onclick="login()">Login</button>

<p id="error">Wrong Username or Password</p>

</div>

<div id="adminPanel">

<header>
<h1>Global Online Shop Admin Panel</h1>
<p>Realtime Firebase Order System</p>
</header>

<div class="cards">

<div class="card">
<h2 id="totalOrders">0</h2>
<p>Total Orders</p>
</div>

<div class="card">
<h2 id="totalSales">৳0</h2>
<p>Total Sales</p>
</div>

<div class="card">
<h2>Realtime</h2>
<p>Firebase Database</p>
</div>

</div>

<div class="menu-bar">

<button onclick="loadOrders()">All Orders</button>

<button onclick="todayOrders()">Today Orders</button>

<button onclick="clearFilter()">Clear Filter</button>

</div>

<div class="filters">

<h3 style="color:green;margin-bottom:10px;">
Order History Filter
</h3>

<label>From Date:</label>
<input type="date" id="fromDate">

<label>To Date:</label>
<input type="date" id="toDate">

<button style="width:auto;" onclick="filterOrders()">
Search Orders
</button>

</div>

<table>

<thead>

<tr>
<th>Customer</th>
<th>Mobile</th>
<th>Address</th>
<th>Product</th>
<th>Total</th>
<th>Status</th>
</tr>

</thead>

<tbody id="orderTable">

<tr>
<td colspan="6">No orders found yet</td>
</tr>

</tbody>

</table>

<button class="logout" onclick="logout()">Logout</button>

<footer>
© 2026 Global Online Shop Admin Panel
</footer>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAlCW-a1EWiHRdCmghUMfGM1RImXUoCWo",
authDomain: "global-online-shop.firebaseapp.com",
projectId: "global-online-shop",
storageBucket: "global-online-shop.firebasestorage.app",
messagingSenderId: "63053384722",
appId: "1:63053384722:web:7970ddc7b3ac0906251ccb"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.login = function(){

let user=document.getElementById("username").value;

let pass=document.getElementById("password").value;


/* ===== ADMIN USERNAME & PASSWORD ===== */

if(user==="AnisBoss" && pass==="Dragon2026"){

document.getElementById("loginBox").style.display="none";

document.getElementById("adminPanel").style.display="block";

loadOrders();

}else{

document.getElementById("error").style.display="block";

}

}

window.logout = function(){

location.reload();

}

window.loadOrders = async function(){

const querySnapshot = await getDocs(collection(db, "orders"));

let table=document.getElementById("orderTable");

let totalOrders=document.getElementById("totalOrders");

let totalSales=document.getElementById("totalSales");

table.innerHTML="";

let count=0;

let sales=0;

querySnapshot.forEach((doc)=>{

const order=doc.data();

count++;

sales+=Number(order.total);

table.innerHTML+=`

<tr>

<td>${order.customerName}</td>

<td>${order.mobile}</td>

<td>${order.address}</td>

<td>${order.product}</td>

<td>৳${order.total}</td>

<td class="status">
${order.status}
</td>

</tr>

`;

});

if(count===0){

table.innerHTML=`
<tr>
<td colspan="6">
No orders found yet
</td>
</tr>
`;

}

totalOrders.innerText=count;

totalSales.innerText="৳"+sales;

}

window.todayOrders = function(){

alert("Firebase realtime orders working");

}

window.clearFilter = function(){

loadOrders();

}

window.filterOrders = function(){

alert("Date filter ready for next update");

}

</script>

</body>
</html>
