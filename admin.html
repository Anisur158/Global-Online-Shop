<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#222}
.login-box{max-width:400px;background:white;padding:30px;border-radius:15px;box-shadow:0 4px 15px #ddd;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
input,button{width:100%;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #ccc}
button{background:green;color:white;border:none;font-weight:bold;cursor:pointer}
#adminPanel{display:none}
header{background:linear-gradient(135deg,green,#00c853);color:white;text-align:center;padding:25px}
.menu{background:white;padding:15px;text-align:center;box-shadow:0 2px 10px #ddd}
.menu button{width:auto;margin:5px;padding:10px 16px}
.container{max-width:1200px;margin:25px auto;padding:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:20px}
.card{background:white;padding:20px;border-radius:14px;text-align:center;box-shadow:0 4px 14px #ddd}
.card h2{color:green}
.filters{background:white;padding:18px;border-radius:12px;box-shadow:0 4px 14px #ddd;margin-bottom:20px}
.filters input{width:auto}
table{width:100%;border-collapse:collapse;background:white;box-shadow:0 4px 14px #ddd;border-radius:12px;overflow:hidden}
th{background:green;color:white;padding:12px}
td{padding:12px;border-bottom:1px solid #eee;text-align:center}
.status{color:orange;font-weight:bold}
.logout{background:red;width:auto;padding:10px 18px}
.error{color:red;display:none}
</style>
</head>
<body>

<div class="login-box" id="loginBox">
<h1 style="color:green">Admin Login</h1>
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="error" class="error">Wrong username or password</p>
</div>

<div id="adminPanel">
<header>
<h1>Global Online Shop Admin Panel</h1>
<p>Lifetime Order History</p>
</header>

<div class="menu">
<button onclick="showAllOrders()">All Orders</button>
<button onclick="showTodayOrders()">Today Orders</button>
<button onclick="clearFilter()">Clear Filter</button>
<button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="cards">
<div class="card">
<h2 id="totalOrders">0</h2>
<p>Total Orders</p>
</div>
<div class="card">
<h2 id="totalSales">৳0</h2>
<p>Total Sales</p>
</div>
<div class="card">
<h2 id="filterTitle">All</h2>
<p>Current View</p>
</div>
</div>

<div class="filters">
<h3 style="color:green">Date Range Filter</h3>
<label>From Date:</label>
<input type="date" id="fromDate">
<label>To Date:</label>
<input type="date" id="toDate">
<button style="width:auto;padding:10px 18px" onclick="filterByDateRange()">Search</button>
</div>

<table>
<thead>
<tr>
<th>Order ID</th>
<th>Date</th>
<th>Customer</th>
<th>Mobile</th>
<th>Address</th>
<th>Products</th>
<th>Payment</th>
<th>Total</th>
<th>Status</th>
</tr>
</thead>
<tbody id="orderTable">
<tr><td colspan="9">No orders found yet</td></tr>
</tbody>
</table>

</div>
</div>

<script>
function login(){
  let user=username.value;
  let pass=password.value;

  if(user==="AnisBoss" && pass==="Dragon2026"){
    loginBox.style.display="none";
    adminPanel.style.display="block";
    showAllOrders();
  }else{
    error.style.display="block";
  }
}

function logout(){
  location.reload();
}

function getOrders(){
  return JSON.parse(localStorage.getItem("orders")) || [];
}

function renderOrders(orders,title){
  let table=document.getElementById("orderTable");
  let total=0;

  totalOrders.innerText=orders.length;
  filterTitle.innerText=title;

  if(orders.length===0){
    table.innerHTML='<tr><td colspan="9">No orders found yet</td></tr>';
    totalSales.innerText="৳0";
    return;
  }

  table.innerHTML="";

  orders.slice().reverse().forEach(order=>{
    total += Number(order.total);

    table.innerHTML += `
    <tr>
      <td>${order.id || "-"}</td>
      <td>${order.dateTime || order.date || "-"}</td>
      <td>${order.name}</td>
      <td>${order.mobile}</td>
      <td>${order.village}, ${order.thana}, ${order.district}</td>
      <td>${order.products}</td>
      <td>${order.payment}</td>
      <td>৳${order.total}</td>
      <td class="status">${order.status || "Pending"}</td>
    </tr>`;
  });

  totalSales.innerText="৳"+total;
}

function showAllOrders(){
  renderOrders(getOrders(),"All");
}

function showTodayOrders(){
  let today=new Date().toISOString().split("T")[0];
  let orders=getOrders().filter(o=>o.date===today);
  renderOrders(orders,"Today");
}

function filterByDateRange(){
  let from=fromDate.value;
  let to=toDate.value;

  if(!from || !to){
    alert("Please select From Date and To Date");
    return;
  }

  let orders=getOrders().filter(o=>o.date>=from && o.date<=to);
  renderOrders(orders,from+" to "+to);
}

function clearFilter(){
  fromDate.value="";
  toDate.value="";
  showAllOrders();
}
</script>

</body>
</html>
