<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Online Shop Admin Panel</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

.login-box{
width:100%;
max-width:400px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 4px 20px rgba(0,0,0,0.1);
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

.login-box h1{
color:green;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:green;
color:white;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
margin-top:10px;
font-weight:bold;
}

button:hover{
background:#009933;
}

#error{
color:red;
margin-top:15px;
display:none;
}

#adminPanel{
display:none;
padding:20px;
}

header{
background:linear-gradient(135deg,#00c853,green);
color:white;
padding:30px;
text-align:center;
border-radius:12px;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 4px 15px #ddd;
}

.card h2{
color:green;
margin-bottom:10px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 4px 15px #ddd;
}

th{
background:green;
color:white;
padding:15px;
}

td{
padding:14px;
border-bottom:1px solid #eee;
text-align:center;
}

.logout{
background:red;
width:auto;
padding:10px 18px;
margin-top:20px;
}

footer{
text-align:center;
padding:20px;
background:#111;
color:white;
margin-top:30px;
}
</style>
</head>

<body>

<div class="login-box" id="loginBox">

<h1>Admin Login</h1>

<input type="text" id="username" placeholder="Anisur2756">

<input type="password" id="password" placeholder="33669933">

<button onclick="login()">Login</button>

<p id="error">Wrong Username or Password</p>

</div>

<div id="adminPanel">

<header>
<h1>Global Online Shop Admin Panel</h1>
<p>Manage customer orders</p>
</header>

<div class="cards">

<div class="card">
<h2 id="totalOrders">0</h2>
<p>Total Orders</p>
</div>

<div class="card">
<h2 id="totalSales">৳0</h2>
<p>Total Sales</p>
</div>

<div class="card">
<h2>Pending</h2>
<p>Order Status</p>
</div>

</div>

<h2 style="margin-bottom:15px;color:green;">Latest Orders</h2>

<table>

<thead>
<tr>
<th>Customer</th>
<th>Mobile</th>
<th>Address</th>
<th>Products</th>
<th>Payment</th>
<th>Total</th>
<th>Status</th>
</tr>
</thead>

<tbody id="orderTable">

<tr>
<td colspan="7">No orders found yet</td>
</tr>

</tbody>

</table>

<button class="logout" onclick="logout()">Logout</button>

<footer>
© 2026 Global Online Shop Admin Panel
</footer>

</div>

<script>

function login(){

let user=document.getElementById("username").value;

let pass=document.getElementById("password").value;


/* ===== ADMIN USERNAME & PASSWORD ===== */

if(user==="AnisBoss" && pass==="Dragon2026"){


document.getElementById("loginBox").style.display="none";

document.getElementById("adminPanel").style.display="block";

loadOrders();

}else{

document.getElementById("error").style.display="block";

}

}

function logout(){

location.reload();

}

function loadOrders(){

let orders=JSON.parse(localStorage.getItem("orders")) || [];

let table=document.getElementById("orderTable");

let totalOrders=document.getElementById("totalOrders");

let totalSales=document.getElementById("totalSales");

if(orders.length===0){

table.innerHTML=`
<tr>
<td colspan="7">No orders found yet</td>
</tr>
`;

return;

}

table.innerHTML="";

let sales=0;

orders.reverse().forEach(order=>{

sales+=Number(order.total);

table.innerHTML+=`

<tr>
<td>${order.name}</td>

<td>${order.mobile}</td>

<td>
${order.village},
${order.thana},
${order.district}
</td>

<td>${order.products}</td>

<td>${order.payment}</td>

<td>৳${order.total}</td>

<td style="color:orange;font-weight:bold;">
Pending
</td>

</tr>

`;

});

totalOrders.innerText=orders.length;

totalSales.innerText="৳"+sales;

}

</script>

</body>
</html>
