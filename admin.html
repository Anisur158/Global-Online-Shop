<!DOCTYPE html>
<html>
<head>
  <title>Global Online Shop Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{font-family:Arial;background:#f4f7fb;margin:0;color:#222}
    header{background:linear-gradient(135deg,green,#00c853);color:white;text-align:center;padding:25px}
    .container{max-width:1100px;margin:30px auto;padding:20px}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:25px}
    .card{background:white;padding:22px;border-radius:14px;box-shadow:0 4px 14px #ddd;text-align:center}
    .card h2{color:green}
    table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px #ddd}
    th,td{padding:14px;border-bottom:1px solid #eee;text-align:left}
    th{background:green;color:white}
    .status{background:#ffe082;padding:6px 10px;border-radius:6px;font-weight:bold}
    footer{background:#111;color:white;text-align:center;padding:18px;margin-top:30px}
  </style>
</head>

<body>

<header>
  <h1>Global Online Shop Admin Panel</h1>
  <p>Manage customer orders</p>
</header>

<div class="container">

  <div class="cards">
    <div class="card">
      <h2 id="totalOrders">0</h2>
      <p>Total Orders</p>
    </div>

    <div class="card">
      <h2 id="totalSales">৳0</h2>
      <p>Total Sales</p>
    </div>

    <div class="card">
      <h2>Pending</h2>
      <p>Order Status</p>
    </div>
  </div>

  <h2 style="color:green;margin-bottom:15px;">Latest Orders</h2>

  <table>
    <thead>
      <tr>
        <th>Customer</th>
        <th>Mobile</th>
        <th>Address</th>
        <th>Products</th>
        <th>Payment</th>
        <th>Total</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="ordersTable">
      <tr>
        <td colspan="7" style="text-align:center;">No orders found yet</td>
      </tr>
    </tbody>
  </table>

</div>

<footer>
  © 2026 Global Online Shop Admin Panel
</footer>

<script>
  const orders = JSON.parse(localStorage.getItem("orders")) || [];

  function loadOrders(){
    const table = document.getElementById("ordersTable");
    const totalOrders = document.getElementById("totalOrders");
    const totalSales = document.getElementById("totalSales");

    table.innerHTML = "";

    if(orders.length === 0){
      table.innerHTML = '<tr><td colspan="7" style="text-align:center;">No orders found yet</td></tr>';
      totalOrders.innerText = "0";
      totalSales.innerText = "৳0";
      return;
    }

    let sales = 0;

    orders.forEach(order => {
      sales += order.total;

      table.innerHTML += `
        <tr>
          <td>${order.name}</td>
          <td>${order.mobile}</td>
          <td>${order.village}, ${order.thana}, ${order.district}</td>
          <td>${order.products}</td>
          <td>${order.payment}</td>
          <td>৳${order.total}</td>
          <td><span class="status">Pending</span></td>
        </tr>
      `;
    });

    totalOrders.innerText = orders.length;
    totalSales.innerText = "৳" + sales;
  }

  loadOrders();
</script>

</body>
</html>
