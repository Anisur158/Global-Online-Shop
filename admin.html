<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Global Online Shop</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
        body{background:#f0f2f5}
        .sidebar{position:fixed;left:0;top:0;width:260px;height:100%;background:linear-gradient(135deg,#1e8e3e,#0d5c1a);color:white;padding:20px}
        .sidebar h2{text-align:center;margin-bottom:30px}
        .sidebar a{display:block;color:white;text-decoration:none;padding:12px;margin:8px 0;border-radius:8px;cursor:pointer}
        .sidebar a:hover{background:rgba(255,255,255,0.2)}
        .main{margin-left:260px;padding:20px}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:20px}
        .stat-card{background:white;padding:25px;border-radius:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        .stat-card h2{color:#1e8e3e;font-size:2rem}
        .card{background:white;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        input,select{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px}
        button{background:#1e8e3e;color:white;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold}
        button:hover{background:#0d5c1a}
        table{width:100%;border-collapse:collapse;overflow-x:auto;display:block}
        th,td{padding:12px;text-align:left;border-bottom:1px solid #eee}
        th{background:#1e8e3e;color:white}
        .login-box{max-width:400px;margin:100px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
        .login-box h2{text-align:center;color:#1e8e3e;margin-bottom:20px}
        .error{color:red;text-align:center;margin-top:10px;display:none}
        @media (max-width:768px){.sidebar{width:100%;height:auto;position:relative}.main{margin-left:0}}
    </style>
</head>
<body>

<div id="loginArea" class="login-box">
    <h2>🔐 Admin Login</h2>
    <input type="text" id="adminUser" placeholder="Username">
    <input type="password" id="adminPass" placeholder="Password">
    <button onclick="adminLogin()">Login</button>
    <p id="errorMsg" class="error">Wrong username or password!</p>
</div>

<div id="adminPanel" style="display:none;">
    <div class="sidebar">
        <h2>⚙️ Admin Panel</h2>
        <a onclick="showDashboard()">📊 Dashboard</a>
        <a onclick="showSellers()">👥 All Sellers</a>
        <a onclick="showOrders()">📋 All Orders</a>
        <a onclick="logout()">🚪 Logout</a>
    </div>

    <div class="main">
        <h1 style="margin-bottom:20px;">Admin Dashboard</h1>
        
        <div class="stats">
            <div class="stat-card"><h2 id="todayOrders">0</h2><p>Today's Orders</p></div>
            <div class="stat-card"><h2 id="todayEarnings">৳0</h2><p>Today's Earnings (Commission)</p></div>
            <div class="stat-card"><h2 id="totalOrdersStat">0</h2><p>Total Orders</p></div>
            <div class="stat-card"><h2 id="totalRevenue">৳0</h2><p>Total Platform Revenue</p></div>
        </div>

        <div class="card">
            <h3>🔍 Search Orders by Date</h3>
            <input type="date" id="searchDateAdmin">
            <button onclick="searchOrdersByDateAdmin()">Search Orders</button>
            <div id="dateSearchResultAdmin" style="margin-top:20px;"></div>
        </div>

        <div id="sellersSection" class="card" style="display:none;">
            <h3>👥 All Registered Sellers</h3>
            <div id="sellersList" style="overflow-x:auto;"></div>
        </div>

        <div id="ordersSectionAdmin" class="card" style="display:none;">
            <h3>📋 All Orders</h3>
            <div id="allOrdersListAdmin" style="overflow-x:auto;"></div>
        </div>
    </div>
</div>

<script>
    function adminLogin() {
        let user = document.getElementById('adminUser').value;
        let pass = document.getElementById('adminPass').value;
        
        // Login credentials
        if(user === 'Saon236' && pass === 'Dragon2026') {
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            showDashboard();
            document.getElementById('errorMsg').style.display = 'none';
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    function getData(key) {
        let data = localStorage.getItem(key);
        return data ? JSON.parse(data) : [];
    }

    function showDashboard() {
        document.getElementById('sellersSection').style.display = 'none';
        document.getElementById('ordersSectionAdmin').style.display = 'none';
        loadAdminStats();
    }

    function loadAdminStats() {
        let orders = getData('shop_orders');
        let today = new Date().toISOString().split('T')[0];
        
        let todayOrders = orders.filter(o => o.date && o.date.includes(today));
        let todayCommission = todayOrders.reduce((sum, o) => sum + (o.commission || 0), 0);
        let totalCommission = orders.reduce((sum, o) => sum + (o.commission || 0), 0);
        
        document.getElementById('todayOrders').innerHTML = todayOrders.length;
        document.getElementById('todayEarnings').innerHTML = '৳' + todayCommission.toLocaleString();
        document.getElementById('totalOrdersStat').innerHTML = orders.length;
        document.getElementById('totalRevenue').innerHTML = '৳' + totalCommission.toLocaleString();
    }

    function showSellers() {
        let users = getData('shop_users');
        let sellers = users.filter(u => u.type === 'seller');
        let products = getData('shop_products');
        let orders = getData('shop_orders');
        
        if(sellers.length === 0) {
            document.getElementById('sellersList').innerHTML = '<p>No sellers registered yet.</p>';
        } else {
            let html = '<table style="width:100%;"> <tr style="background:#1e8e3e;color:white;"> <th>#</th> <th>Name</th> <th>Phone/Email</th> <th>Joined Date</th> <th>Products</th> <th>Total Sales</th> </tr>';
            sellers.forEach((s, idx) => {
                let sellerProducts = products.filter(p => p.sellerId === s.id);
                let sellerOrders = orders.filter(o => o.sellerId === s.id);
                let totalSales = sellerOrders.reduce((sum, o) => sum + (o.subtotal || 0), 0);
                
                html += `<tr>
                    <td>${idx + 1}</td>
                    <td>${s.name || 'N/A'}</td>
                    <td>${s.emailPhone || s.phone || 'N/A'}</td>
                    <td>${s.createdAt ? s.createdAt.split('T')[0] : 'N/A'}</td>
                    <td>${sellerProducts.length}</td>
                    <td>৳${totalSales.toLocaleString()}</td>
                </tr>`;
            });
            html += '</table>';
            document.getElementById('sellersList').innerHTML = html;
        }
        
        document.getElementById('sellersSection').style.display = 'block';
        document.getElementById('ordersSectionAdmin').style.display = 'none';
    }

    function showOrders() {
        let orders = getData('shop_orders');
        
        if(orders.length === 0) {
            document.getElementById('allOrdersListAdmin').innerHTML = '<p>No orders found.</p>';
        } else {
            let html = '<table style="width:100%;"> <tr style="background:#1e8e3e;color:white;"> <th>Order ID</th> <th>Customer</th> <th>Seller</th> <th>Products</th> <th>Amount</th> <th>Commission</th> <th>Status</th> <th>Date</th> </tr>';
            orders.forEach(o => {
                html += `<tr>
                    <td>${o.id || o.mainOrderId || 'N/A'}</td>
                    <td>${o.customerName || 'N/A'}<br><small>${o.customerPhone || ''}</small></td>
                    <td>${o.sellerName || 'N/A'}</td>
                    <td>${o.products || 'N/A'}</td>
                    <td>৳${(o.subtotal || o.total || 0).toLocaleString()}</td>
                    <td>৳${(o.commission || 0).toLocaleString()}</td>
                    <td>${o.status || 'Pending'}</td>
                    <td>${o.date || 'N/A'}</td>
                </tr>`;
            });
            html += '</table>';
            document.getElementById('allOrdersListAdmin').innerHTML = html;
        }
        
        document.getElementById('ordersSectionAdmin').style.display = 'block';
        document.getElementById('sellersSection').style.display = 'none';
    }

    function searchOrdersByDateAdmin() {
        let date = document.getElementById('searchDateAdmin').value;
        if(!date) {
            alert('Please select a date');
            return;
        }
        
        let orders = getData('shop_orders');
        let filtered = orders.filter(o => o.date && o.date.includes(date));
        let totalCommission = filtered.reduce((sum, o) => sum + (o.commission || 0), 0);
        
        if(filtered.length === 0) {
            document.getElementById('dateSearchResultAdmin').innerHTML = `<p>No orders found on ${date}</p>`;
        } else {
            let html = `<h4>📅 Orders on ${date}</h4>
                        <p><strong>💰 Total Commission Earned: ৳${totalCommission.toLocaleString()}</strong></p>
                        <table style="width:100%;"> <tr style="background:#1e8e3e;color:white;"> <th>Order ID</th> <th>Customer</th> <th>Seller</th> <th>Amount</th> <th>Commission</th> </tr>`;
            filtered.forEach(o => {
                html += `<tr>
                    <td>${o.id || o.mainOrderId}</td>
                    <td>${o.customerName}</td>
                    <td>${o.sellerName}</td>
                    <td>৳${(o.subtotal || o.total || 0).toLocaleString()}</td>
                    <td>৳${(o.commission || 0).toLocaleString()}</td>
                </tr>`;
            });
            html += '</table>';
            document.getElementById('dateSearchResultAdmin').innerHTML = html;
        }
    }

    function logout() {
        location.reload();
    }

    // Check if already logged in (optional)
    if(localStorage.getItem('adminLoggedIn') === 'true') {
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        showDashboard();
    }
</script>
</body>
</html>
